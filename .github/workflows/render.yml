
name: render-specs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2 # If you're using actions/checkout@v2 you must set persist-credentials to false in most cases for the deployment to work correctly.
        with:
          persist-credentials: false

      - name: Install and Build 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        run: |
          npm install
          node -e "require('spec-up')({ nowatch: true })"
          rm -rf node_modules

      - name: Copy images to site root
        # spec-up renders index.html at the repo root but preserves image
        # paths from the markdown source (e.g. `images/foo.png`), which are
        # relative to docs/report.md. Copying docs/images/ to ./images/ makes
        # those paths resolve correctly on the deployed site without breaking
        # GitHub's rendering of the markdown source.
        run: cp -R docs/images images

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3.7.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          allow_empty_commit: true
          force_orphan: true